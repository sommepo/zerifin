name: Zerifin bug report
description: Report a problem with playback, subtitle lookup, dictionaries, mining or YouTube.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search this fork's existing issues first. Remove credentials, private media and personal card content from anything you attach.
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Steps to reproduce, expected behavior and actual behavior.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature
      options: [Jellyfin playback, Subtitle lookup, Dictionaries, Anki mining, YouTube, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zerifin version or commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device model
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Media and setup
      description: Relevant Jellyfin/AnkiDroid versions, subtitle format, audio language, dictionary format or public YouTube URL. Do not attach private archives.
  - type: textarea
    id: error
    attributes:
      label: Error message or relevant log lines
      description: For mining, include Last card error. For YouTube, include the companion's categorized error. Remove tokens, session URLs and private data.
      render: text
