name: Zerifin checks

on:
  push:
    branches: [main, master, 'codex/public-fork']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerifin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Test and check
        run: ./gradlew test detekt lintLibreDebug
      - name: Assemble unsigned release APK
        run: ./gradlew assembleLibreRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerifin-libre-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/libre/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 14

  companion-and-menu:
    name: Companion and menu tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolver tests
        run: python3 -m unittest discover -s companion/youtube -v
      - name: Web menu checks
        run: ./scripts/check-web-menu.sh
